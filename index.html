<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listão</title>
<meta name="description" content="Recebeu um link de lista de compras? Toque no celular com o app Listão instalado e a lista abre direto — sem cadastro, sem internet no meio do caminho.">
<link rel="canonical" href="https://luisgustavodb.github.io/mercadinho/">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#53B175">
<link rel="icon" type="image/svg+xml" href="/mercadinho/favicon.svg">
<link rel="icon" type="image/png" sizes="48x48" href="/mercadinho/favicon-48.png">
<style>
  body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:#fff; color:#181725;
         display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; }
  .card { padding:32px; max-width:420px; }
  h1 { font-size:44px; margin:0 0 8px; }
  .logo { width:46px; height:46px; vertical-align:-10px; margin-right:8px; }
  .verde { color:#53B175; }
  p { color:#7C7C7C; font-size:17px; line-height:1.5; }
  .badge { display:inline-block; background:#F2F3F2; border-radius:20px; padding:8px 20px;
           color:#181725; font-weight:600; margin-top:16px; }
</style>
</head>
<body>
  <div class="card">
    <h1><img class="logo" src="/mercadinho/simbolo-verde.svg" alt=""><span class="verde">Listão</span></h1>
    <p>Sua lista de compras chegou!</p>
    <p>Toque no link pelo celular que tem o app instalado e a lista abre direto — sem cadastro, sem internet no meio do caminho.</p>
    <span class="badge">Ainda não tem o app? Peça para quem enviou 😉</span>
  </div>
</body>
</html>
